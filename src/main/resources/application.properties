server.port=${PORT:8000}
spring.application.name=team-a-os-engine
teama.build.version=${RENDER_GIT_COMMIT:unknown}

# Default Operating System Queue Strategy (fifo, circular, priority, heap)
teama.queue.strategy=heap
teama.queue.circular-capacity=1000

# Exclusive Interview Slot Lease TTL (Seconds)
teama.lock.default-lease-ttl-seconds=300

# JSON Timestamp ISO-8601 formatting
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC

# Telemetry streaming pulse interval in milliseconds
teama.telemetry.pulse-ms=2000
# Set TEAM_A_SERVICE_TOKEN in production to enforce a shared service credential.
teama.security.service-token=${TEAM_A_SERVICE_TOKEN:}

# Optional outbound result delivery to Team C. Disabled until Team C confirms the callback route/contract.
teama.team-c.callback.enabled=${TEAM_C_CALLBACK_ENABLED:false}
teama.team-c.callback.base-url=${TEAM_C_BASE_URL:}
teama.team-c.callback.token=${TEAM_C_CALLBACK_TOKEN:}
teama.team-c.callback.connect-timeout=${TEAM_C_CONNECT_TIMEOUT:2s}
teama.team-c.callback.read-timeout=${TEAM_C_READ_TIMEOUT:5s}
teama.team-c.callback.max-attempts=${TEAM_C_CALLBACK_MAX_ATTEMPTS:3}
teama.team-c.callback.retry-backoff=${TEAM_C_CALLBACK_RETRY_BACKOFF:250ms}
